syntax = "proto3";

package epeius.quote.v1;

option go_package = "github.com/kuchmenko/epeius/generated/go/epeius/quote/v1;quotev1";

// QuoteService builds and simulates transactions, but never signs or sends them.
service QuoteService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetQuote(QuoteRequest) returns (QuoteFinal);
  rpc StreamQuote(QuoteRequest) returns (stream QuoteEvent);
  rpc PrepareExecution(PrepareExecutionRequest) returns (PrepareExecutionResponse);
}

message GetStatusRequest {}

message Token {
  string address = 1;
  string symbol = 2;
  uint32 decimals = 3;
}

message ChainStatus {
  string key = 1;
  string chain_id = 2;
  // Connectivity verified at startup, not a continuous health check.
  bool connected = 3;
  string error = 4;
  bool quoting_supported = 5;
  repeated Token tokens = 6;
  BlockContext block = 7;
  bool execution_enabled = 8;
}

message GetStatusResponse {
  repeated ChainStatus chains = 1;
}

message QuoteRequest {
  reserved 1, 2, 3, 7;
  reserved "environment", "sender", "recipient", "slippage_bps";
  string token_in = 4;
  string token_out = 5;
  // Positive base-10 integer in the input token's smallest unit.
  string amount_in_atomic = 6;
  uint32 search_budget_ms = 8;
  string chain = 9;
  string chain_id = 10;
}

message BlockContext {
  string number = 1;
  string hash = 2;
}

message UniswapV4PoolKey {
  string currency0 = 1;
  string currency1 = 2;
  // Static LP fee in millionths, not basis points.
  uint32 fee_pips = 3;
  int32 tick_spacing = 4;
  string hooks = 5;
}

message RouteLeg {
  string pool = 1;
  string token_in = 2;
  string token_out = 3;
  oneof selector {
    // Pool fee in millionths, not basis points.
    uint32 fee_pips = 4;
    // Slipstream pool selector, not a fee.
    int32 tick_spacing = 5;
  }
  UniswapV4PoolKey uniswap_v4_pool_key = 6;
}

message RouteQuote {
  string route_id = 1;
  string provider = 2;
  repeated RouteLeg legs = 3;
  string amount_out_atomic = 4;
  // Absent means unknown; never interpret absence as zero cost.
  optional string network_cost_out_atomic = 5;
  optional string effective_out_atomic = 6;
  BlockContext block = 7;
  uint32 latency_ms = 8;
  string deployment_id = 9;
}

message ProviderError {
  string provider = 1;
  optional string route_id = 2;
  string message = 3;
}

message QuoteFinal {
  string quote_id = 1;
  repeated RouteQuote routes = 2;
  repeated ProviderError errors = 3;
  optional string best_route_id = 4;
  BlockContext block = 5;
  // All candidate attempts finished within the search budget, even if some failed.
  bool search_complete = 6;
}

message QuoteEvent {
  oneof event {
    RouteQuote quote = 1;
    ProviderError error = 2;
    QuoteFinal final = 3;
  }
}

message PrepareExecutionRequest {
  string quote_id = 1;
  string route_id = 2;
  string sender = 3;
  uint32 slippage_bps = 4;
  // Recheck immutable terms. When present, all other fields must be empty.
  string preparation_id = 5;
  // Executor plan, mutually exclusive with route_id. Inputs must sum to the
  // original quote input. Each selected path is quoted at its exact input.
  repeated RouteAllocation allocations = 6;
}

message RouteAllocation {
  string route_id = 1;
  string amount_in_atomic = 2;
}

message QuotedAllocation {
  string amount_in_atomic = 1;
  RouteQuote route = 2;
}

enum PreparationStatus {
  PREPARATION_STATUS_UNSPECIFIED = 0;
  PREPARATION_STATUS_READY = 1;
  PREPARATION_STATUS_APPROVAL_REQUIRED = 2;
  PREPARATION_STATUS_REQUOTE_REQUIRED = 3;
  PREPARATION_STATUS_REJECTED = 4;
}

message UnsignedTransaction {
  string chain_id = 1;
  string to = 2;
  string data = 3;
  string value_atomic = 4;
  string from = 5;
  string gas_limit = 6;
}

message OnChainPermission {
  UnsignedTransaction transaction = 1;
  // Contract receiving the permission call.
  string target = 2;
  string token = 3;
  // Contract delegated by the permission target.
  string spender = 4;
  string amount_atomic = 5;
  string expiration_unix = 6;
}

message PrepareExecutionResponse {
  PreparationStatus status = 1;
  // Only a READY response may contain a swap transaction.
  UnsignedTransaction transaction = 2;
  string message = 3;
  string preparation_id = 4;
  string expires_at_unix = 5;
  string amount_out_minimum_atomic = 6;
  string amount_in_atomic = 7;
  string token_in = 8;
  string token_out = 9;
  string recipient = 10;
  string deadline_unix = 11;
  BlockContext simulation_block = 12;
  // Separate approval; its success never makes the old quote executable.
  UnsignedTransaction approval_transaction = 13;
  string approval_spender = 14;
  string simulated_amount_out_atomic = 15;
  RouteQuote route = 16;
  // Present only for executor preparation; route is then absent. All allocation
  // quotes share one block. Slippage applies after summing their exact outputs.
  repeated QuotedAllocation allocations = 17;
  // Separate typed permission transaction. Its success never makes this
  // preparation executable and never replaces the legacy ERC-20 approval.
  OnChainPermission on_chain_permission = 18;
}
