name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache-dependency-path: |
            generated/go/go.sum
            services/quote-engine/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run check
      - run: bun run check:generated
      - name: Check dependency files stayed unchanged
        run: git diff --exit-code -- bun.lock generated/go/go.mod generated/go/go.sum services/quote-engine/go.mod services/quote-engine/go.sum
