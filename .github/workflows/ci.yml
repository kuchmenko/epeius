name: Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache-dependency-path: |
            generated/go/go.sum
            services/quote-engine/go.sum
      - run: bun install --frozen-lockfile
      - run: bun install --cwd scripts/testnet --frozen-lockfile --ignore-scripts
      - run: bun run setup
      - run: bun run check
      - name: Check Protobuf compatibility
        if: github.event_name == 'pull_request'
        run: bunx --no-install buf breaking --against "https://github.com/kuchmenko/epeius.git#branch=main"
      - run: bun run check:generated
      - name: Check dependency files stayed unchanged
        run: git diff --exit-code -- bun.lock generated/go/go.mod generated/go/go.sum services/quote-engine/go.mod services/quote-engine/go.sum

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: bun install --cwd scripts/testnet --frozen-lockfile --ignore-scripts
      - run: bun scripts/testnet/prepare.mjs
      - run: bun test scripts/testnet
      - run: forge fmt --check contracts/src/Executor.sol contracts/test/Executor.t.sol contracts/test/ExecutorRouters.t.sol
      - run: forge test --root contracts
      - name: Check harness dependency files stayed unchanged
        run: git diff --exit-code -- scripts/testnet/bun.lock
